# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8001}

# ==========================================
# APPLICATION
# ==========================================
spring.application.name=auth-service
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001,http://localhost:3002}

# ==========================================
# DATABASE - H2 In-Memory (Configuración para Render)
# ==========================================
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,PASSWORD,ENABLED,ROLE,VALUE,KEY,TOKEN
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==========================================
# H2 CONSOLE
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================
# EXTERNAL SERVICES
# ==========================================
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8007/api/notifications}

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:aB3cD7eF2gH9iJ4kL6mN8oP1qR5sT0uV}
jwt.expiration=${JWT_EXPIRATION:86400000}
